<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>拼字闖關 - 國小二年級</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<link rel="manifest" href="site.webmanifest" />
<meta name="theme-color" content="#818cf8" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="拼字闖關" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { overflow-x: hidden; max-width: 100%; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  button { user-select: none; -webkit-user-select: none; }

  /* zhuyin hand-stacked beside each character (same as vocab.html) */
  .zi { display: inline-flex; align-items: center; margin: 0 0.05em; }
  .hanzi { font-size: 1em; line-height: 1; }
  .zhuyin-block { position: relative; display: inline-flex; margin-left: 0.18em; font-size: 0.3em; color: #6366f1; user-select: none; }
  .zhuyin-letters { display: flex; flex-direction: column; line-height: 1.15; }
  .tone-mark { position: absolute; right: -0.7em; bottom: 0.05em; font-size: 0.85em; line-height: 1; }
  .tone-dot { position: absolute; left: 0.05em; top: -0.85em; font-size: 0.85em; line-height: 1; }

  .screen { display: none; }
  .screen.on { display: flex; }

  /* letter slots and tiles */
  .slot { width: 2.9rem; height: 3.4rem; border-bottom: 4px solid #a5b4fc; border-radius: 6px; display: flex; align-items: center; justify-content: center;
          font-size: 2.1rem; font-weight: 800; color: #3730a3; background: #fff; transition: background .15s; }
  .slot.fixed { color: #94a3b8; }
  .slot.ok { background: #dcfce7; border-color: #22c55e; color: #15803d; }
  .slot.bad { background: #fee2e2; border-color: #ef4444; color: #b91c1c; }
  .slot.gap { width: 1.2rem; border: none; background: transparent; }
  .slot.cursor { border-color: #6366f1; background: #eef2ff; }
  .tile { width: 3.6rem; height: 3.6rem; border-radius: 1rem; background: linear-gradient(#fff, #e0e7ff); border: 3px solid #818cf8; box-shadow: 0 4px 0 #6366f1;
          font-size: 2rem; font-weight: 800; color: #3730a3; transition: transform .1s, opacity .15s; }
  .tile:active { transform: translateY(3px); box-shadow: 0 1px 0 #6366f1; }
  .tile.used { opacity: 0; pointer-events: none; }
  @media (max-width: 420px) { .slot { width: 2.2rem; height: 2.8rem; font-size: 1.6rem; } .tile { width: 3rem; height: 3rem; font-size: 1.7rem; } }

  @keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
  .shake { animation: shake .4s; }
  @keyframes hit { 0% { transform: translateX(0) scale(1); filter: none; } 25% { transform: translateX(14px) scale(.92); filter: brightness(1.8) saturate(.4); } 100% { transform: translateX(0) scale(1); filter: none; } }
  .hit { animation: hit .45s; }
  @keyframes giggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
  .giggle { animation: giggle .5s 2; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .bob { animation: bob 2.4s ease-in-out infinite; }
  @keyframes zap { 0% { transform: translate(-50%, 0) scale(.6); opacity: 1; } 100% { transform: translate(-50%, -150px) scale(1.6); opacity: 0; } }
  .zap { position: absolute; left: 50%; bottom: 0; font-size: 2.6rem; animation: zap .45s ease-in forwards; pointer-events: none; }
  @keyframes dmg { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-40px); opacity: 0; } }
  .dmg { position: absolute; right: 18%; top: 10%; font-weight: 900; font-size: 1.8rem; color: #ef4444; animation: dmg .9s forwards; pointer-events: none; }
  @keyframes catch { 0% { transform: scale(.2) rotate(-20deg); opacity: 0; } 60% { transform: scale(1.15) rotate(6deg); opacity: 1; } 100% { transform: scale(1) rotate(0); } }
  .catch { animation: catch .8s ease-out; }
  .hp { transition: width .4s; }
  .xpbar { transition: width 1.2s ease-out; }
  .wobble { animation: giggle 1.4s ease-in-out infinite; }
  @keyframes hop { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-16px) rotate(-8deg); } }
  .hop { animation: hop .45s; }
  @keyframes xpup { 0% { transform: translate(-50%, 0); opacity: 1; } 100% { transform: translate(-50%, -46px); opacity: 0; } }
  .xpf { position: absolute; left: 50%; top: 0; font-weight: 900; font-size: 1.2rem; color: #16a34a; white-space: nowrap; animation: xpup 1s forwards; pointer-events: none; }
  @keyframes glow { 0%,100% { filter: brightness(1); } 50% { filter: brightness(2.6) saturate(.3); } }
  .evshake > svg { animation: shake .4s 4, glow .55s 3; }
  .silhouette svg { filter: brightness(0) opacity(.18); }
  #confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 60; }
  .cf { position: absolute; top: -10%; animation: fall 2.2s ease-in forwards; }
  @keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(540deg); opacity: .8; } }
</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-sky-100 via-yellow-50 to-pink-100 font-sans text-slate-700">

<script src="words.js"></script>
<script>
  // 老師的抽考進度（題號 1 起算）。前一晚在家練隔天要考的範圍。
  const SCHEDULE = [
    ['2026-11-09', 1, 10], ['2026-11-10', 11, 20], ['2026-11-11', 21, 30], ['2026-11-12', 31, 40], ['2026-11-13', 1, 40, '複習'],
    ['2026-11-16', 41, 50], ['2026-11-17', 51, 60], ['2026-11-18', 61, 70],
    ['2026-11-23', 71, 80], ['2026-11-24', 41, 80, '複習'], ['2026-11-25', 81, 90], ['2026-11-26', 91, 100], ['2026-11-27', 101, 110],
    ['2026-11-30', 111, 120], ['2026-12-01', 81, 120, '複習'], ['2026-12-02', 121, 130], ['2026-12-03', 131, 140], ['2026-12-04', 141, 150],
    ['2026-12-07', 1, 50, '複習考'], ['2026-12-09', 51, 100, '複習考'], ['2026-12-11', 101, 150, '複習考'],
    ['2026-12-14', 1, 150, '複習考'], ['2026-12-16', 1, 150, '複習考'], ['2026-12-18', 1, 150, '複習考'], ['2026-12-21', 1, 150, '複習考'],
    ['2026-12-23', 1, 150, '複習考'], ['2026-12-28', 1, 150, '英單認證'],
  ].map(([d, lo, hi, kind]) => ({ d, lo, hi, kind }));
  // 「目前易錯單字」（題號），出現機率提高
  const HARD = new Set([8, 14, 24, 25, 26, 31, 33, 34, 35, 41, 42, 43, 44, 45, 46, 51, 57, 65, 66, 67, 68, 69, 74, 75, 91, 99, 100, 101, 105, 106,
    124, 125, 126, 128, 129, 130, 131, 132, 133, 134, 135, 136, 137, 138, 139, 140, 141, 142, 143, 144, 149, 150]);
  const ROUND_MAX = 12;

  // same 10 monsters as the printed multiplication sheets
  const MONSTERS = [
    { name: '火團團', kind: 'flame', color: '#FF8A4C' }, { name: '水泡泡', kind: 'drop', color: '#5BB8F5' },
    { name: '芽芽獸', kind: 'leaf', color: '#7ACB6A' }, { name: '星光獸', kind: 'star', color: '#FFD84D' },
    { name: '雲朵朵', kind: 'cloud', color: '#E8EEF8' }, { name: '石頭頭', kind: 'rock', color: '#B5A897' },
    { name: '冰晶晶', kind: 'ice', color: '#A9E4F2' }, { name: '幽幽', kind: 'ghost', color: '#B79CF0' },
    { name: '糖糖獸', kind: 'candy', color: '#FF9EC7' }, { name: '閃閃龍', kind: 'dragon', color: '#4CC9B0' },
  ];
  const TAUNT = ['嘿嘿，拼錯囉！', '再想想看～', '差一點點！', '你抓不到我！'];
  const OUCH = ['哎呀！', '好痛！', '你好厲害！', '嗚嗚…', '再來啊！'];

  const $ = (id) => document.getElementById(id);
  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const shuffle = (a) => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  const starred = new Set(load('kev-starred', []));   // word indices, shared with vocab.html
  const dex = load('kev-dex', {});                    // monster index → times caught
  const pets = load('kev-pets', {});                  // monster index → total EXP
  let egg = load('kev-egg', null);                    // { mi, days: ['YYYY-MM-DD', …] }
  let autoSpeak = load('kev-spell-autospeak', true);
  const caughtList = () => MONSTERS.map((_, i) => i).filter(i => dex[i]);
  let partner = load('kev-partner', null);
  if (partner === null || !dex[partner]) partner = caughtList()[0] ?? null;

  // ── 等級／進化 ──
  const MAXLV = 10, EGG_DAYS = 3;
  const need = (L) => 40 * L;                         // EXP from Lv.L to Lv.L+1
  function lvOf(xp) { let L = 1; while (L < MAXLV && xp >= need(L)) { xp -= need(L); L++; } return { lv: L, into: xp, next: L < MAXLV ? need(L) : 0 }; }
  const stageOf = (lv) => lv >= 10 ? 3 : lv >= 5 ? 2 : 1;
  const PREFIX = ['', '', '超級', '傳說'];
  const stageOfMi = (mi) => stageOf(lvOf(pets[mi] || 0).lv);
  const pname = (mi) => PREFIX[stageOfMi(mi)] + MONSTERS[mi].name;
  const mon = (mi, size, face) => monsterSvg(MONSTERS[mi], size, face, stageOfMi(mi));
  function addXp(mi, amt) {
    const b = lvOf(pets[mi] || 0).lv;
    pets[mi] = (pets[mi] || 0) + amt;
    save('kev-pets', pets);
    const a = lvOf(pets[mi]).lv;
    return { b, a, evolve: stageOf(a) > stageOf(b) };
  }
  const evolveEvent = (mi, b, a) => ({
    title: '✨ 咦？夥伴發光了…',
    before: monsterSvg(MONSTERS[mi], 190, 'happy', stageOf(b)),
    after: monsterSvg(MONSTERS[mi], 190, 'happy', stageOf(a)),
    text: `${PREFIX[stageOf(b)]}${MONSTERS[mi].name} 進化成 ${PREFIX[stageOf(a)]}${MONSTERS[mi].name} 了！`,
  });
  function ensureEgg() {
    if (egg) return;
    const un = MONSTERS.map((_, i) => i).filter(i => !dex[i]);
    egg = { mi: un.length ? pick(un) : Math.floor(Math.random() * MONSTERS.length), days: [] };
    save('kev-egg', egg);
  }

  // ── 畫怪獸 ──
  function starPath(cx, cy, R, r) {
    let d = '';
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r : R; d += `${i ? 'L' : 'M'}${(cx + rr * Math.cos(a)).toFixed(1)} ${(cy + rr * Math.sin(a)).toFixed(1)} `; }
    return d + 'Z';
  }
  function eggSvg(mi, size, crack = 0) {
    const c = MONSTERS[mi].color, ink = '#333';
    const spots = [[38, 38, 7], [62, 60, 9], [40, 74, 5], [64, 32, 5], [29, 58, 4]]
      .map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" stroke="${ink}" stroke-width="1.3"/>`).join('');
    const line = (d) => `<path d="${d}" fill="none" stroke="${ink}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
    const cracks = (crack >= 1 ? line('M20 52 L30 58 L38 50 L46 58') : '') + (crack >= 2 ? line('M80 44 L72 51 L66 44 L58 53') : '');
    return `<svg viewBox="0 0 100 100" width="${size}" height="${size}"><ellipse cx="50" cy="96" rx="24" ry="3.5" fill="#000" opacity=".1"/>
      <path d="M50 8 C74 8 82 44 82 62 A32 32 0 0 1 18 62 C18 44 26 8 50 8 Z" fill="#FFFDF2" stroke="${ink}" stroke-width="3"/>${spots}${cracks}</svg>`;
  }

  // ── 注音 ──
  const RUBY_RE = /<ruby>(.*?)<rt>(.*?)<\/rt><\/ruby>/g;

    }

  }

  // ── 聲音 ──
  let voices = [];

  if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }

    wrong: () => { tone(300, 0, 0.15, 0.2, 'triangle'); tone(220, 0.15, 0.25, 0.2, 'triangle'); },

  };

  // ── 關卡選單 ──
  const WEEK = '日一二三四五六';
  const dateLabel = (d) => { const [y, m, dd] = d.split('-').map(Number); return `${m}/${dd}（${WEEK[new Date(y, m - 1, dd).getDay()]}）`; };
  const rangeText = (s) => `第 ${s.lo}～${s.hi} 個單字${s.kind ? `・${s.kind}` : ''}`;
  const ds = (t) => `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`;
  const todayStr = () => ds(new Date());
  function streak() {
    const days = new Set(load('kev-days', [])), d = new Date();
    if (!days.has(ds(d))) d.setDate(d.getDate() - 1);

    while (days.has(ds(d))) { n++; d.setDate(d.getDate() - 1); }

  }
  const nextTest = () => SCHEDULE.find(s => s.d > todayStr()) || SCHEDULE.at(-1);

  function renderHome() {
    const n = nextTest();

    $('nextRange').textContent = rangeText(n);
    $('daySelect').innerHTML = SCHEDULE.map((s, i) => `<option value="${i}"${s === n ? ' selected' : ''}>${dateLabel(s.d)}　${s.lo}～${s.hi}${s.kind ? ' ' + s.kind : ''}</option>`).join('');

    $('startStarred').disabled = !starred.size;

    $('dexCount').textContent = `${MONSTERS.filter((_, i) => dex[i]).length}/10`;
    $('autoSpeak').checked = autoSpeak;

    // 夥伴

  // weighted pick without replacement: 易錯 and ⭐ words ×4
  function weighted(pool, n) {
    return pool.map(i => ({ i, k: Math.random() ** (1 / ((HARD.has(i + 1) || starred.has(i)) ? 4 : 1)) }))

  function roundFor(s) {

      const learned = []; for (let q = 1; q < s.lo; q++) if (HARD.has(q) || starred.has(q - 1)) learned.push(q - 1);

  // ── 戰鬥 ──

  function startRound(words, label) {
    ensureEgg();

  function nextWord() {
    if (!G.queue.length) return finish();
    const wi = G.queue[0], w = WORDS[wi];
    const chars = [...w.en];

    G.cur = { wi, chars, slots: chars.map(c => /[a-z]/.test(c) ? null : { ch: c, fixed: true }), first: !G.again.has(wi), wrong: false };
    const need = chars.filter(c => /[a-z]/.test(c));

  function updateBars() {

  function draw() {
    const c = G.cur;

  function hint() {

  function finish() {

          if (r2.evolve) events.push(evolveEvent(mi, r2.b, r2.a));
        }
        $('rEgg').textContent = '🥚 蛋孵化了！明天會有一顆新的蛋～';
        egg = null;
        ensureEgg();
      } else {
        $('rEgg').textContent = `🔥 幫蛋保暖了！再 ${EGG_DAYS - egg.days.length} 天就會孵化`;
        save('kev-egg', egg);
      }
    }
    save('kev-dex', dex);

    $('rMonster').innerHTML = mon(partner, 190);
    $('rName').textContent = `${pname(partner)} Lv.${after.lv}`;
    const pct = (L) => L.next ? (L.into / L.next) * 100 : 100;
    $('rXp').style.transition = 'none';
    $('rXp').style.width = `${after.lv > before.lv ? 0 : pct(before)}%`;
    void $('rXp').offsetWidth;
    $('rXp').style.transition = '';
    setTimeout(() => { $('rXp').style.width = `${pct(after)}%`; }, 300);
    $('rXpText').textContent = `+${G.xp} EXP` + (after.lv > before.lv ? `　⬆ 升級！Lv.${before.lv} → Lv.${after.lv}` : '') + (after.next ? '' : '　MAX');
    $('rStars').textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
    $('rMsg').textContent = stars === 3 ? '全部一次就拼對，太厲害了！' : stars === 2 ? '很棒！只錯一點點！' : '完成了！拼錯的字已經加上 ⭐，下次再複習～';
    $('rMissed').innerHTML = G.missed.size ? `<p class="text-sm text-slate-400 font-bold mb-1">要多練習的字：</p><div class="flex flex-wrap justify-center gap-2">${[...G.missed].map(i => `<button class="bg-white border-2 border-amber-200 rounded-xl px-3 py-1 font-bold" data-say="${WORDS[i].en}">${WORDS[i].emoji} ${WORDS[i].en}　${WORDS[i].zh}</button>`).join('')}</div>` : '';
    show('result');
    confetti();
    if (events.length) setTimeout(() => playEvents(events), 1400);
  }

  let evQ = [];
  function playEvents(list) { evQ = list; nextEvent(); }
  function nextEvent() {
    const e = evQ.shift();
    if (!e) { $('event').classList.add('hidden'); return; }
    $('event').classList.remove('hidden');
    $('evTitle').textContent = e.title;
    $('evText').textContent = '';
    $('evOk').classList.add('invisible');
    $('evArt').className = 'my-4 evshake';
    $('evArt').innerHTML = e.before;
    setTimeout(() => {
      $('evArt').className = 'my-4 catch';
      $('evArt').innerHTML = e.after;
      $('evText').textContent = e.text;
      $('evOk').classList.remove('invisible');
      sfx.win();
      confetti();
    }, 2300);
  }

  function confetti() {
    for (let i = 0; i < 40; i++) {
      const p = document.createElement('span');
      p.className = 'cf'; p.textContent = pick(['🎉', '✨', '⭐', '🌈', '💫']);
      p.style.left = Math.random() * 100 + '%'; p.style.fontSize = 1 + Math.random() + 'rem';
      p.style.setProperty('--dx', (Math.random() - 0.5) * 200 + 'px'); p.style.animationDelay = Math.random() * 0.5 + 's';
      $('confetti').appendChild(p); setTimeout(() => p.remove(), 3000);
    }
  }

  function renderDex() {
    $('dexGrid').innerHTML = MONSTERS.map((m, i) => {
      if (!dex[i]) return `<div class="text-center silhouette p-1">${monsterSvg(m, 90)}<p class="font-bold text-sm">？？？</p></div>`;
      const L = lvOf(pets[i] || 0), me = i === partner;
      return `<button data-mi="${i}" class="text-center rounded-2xl p-1 border-4 ${me ? 'border-emerald-300 bg-emerald-50' : 'border-transparent'}">${mon(i, 90)}`
        + `<p class="font-bold text-sm leading-tight">${pname(i)}</p><p class="text-xs ${me ? 'text-emerald-600 font-bold' : 'text-slate-400'}">Lv.${L.lv}${L.next ? '' : ' MAX'}${me ? '・夥伴' : ''}</p></button>`;
    }).join('');
  }

  // ── events ──
  let lastStart = null;
  function begin(s) { lastStart = s; startRound(s.words(), s.label); }
  const fromSchedule = (s) => ({ words: () => roundFor(s), label: `${dateLabel(s.d)} ${s.lo}～${s.hi}` });
  $('startToday').onclick = () => begin(fromSchedule(nextTest()));
  $('startPicked').onclick = () => begin(fromSchedule(SCHEDULE[$('daySelect').value]));
  $('startStarred').onclick = () => starred.size && begin({ words: () => shuffle([...starred]).slice(0, ROUND_MAX), label: '⭐ 複習星號字' });
  $('againBtn').onclick = () => begin(lastStart);
  $('menuBtn').onclick = () => { renderHome(); show('home'); };
  $('quitBtn').onclick = () => { renderHome(); show('home'); };
  $('sayBtn').onclick = () => speak(WORDS[G.cur.wi].en);
  $('hintBtn').onclick = hint;
  $('clearBtn').onclick = () => { G.cur.slots.forEach((s, i) => { if (s && !s.fixed && !s.ok) returnSlot(i); }); };
  $('tiles').onclick = (e) => { const b = e.target.closest('[data-tile]'); if (b) placeTile(+b.dataset.tile); };
  $('slots').onclick = (e) => { const b = e.target.closest('[data-slot]'); if (b) returnSlot(+b.dataset.slot); };
  $('rMissed').onclick = (e) => { const b = e.target.closest('[data-say]'); if (b) speak(b.dataset.say); };
  $('autoSpeak').onchange = (e) => { autoSpeak = e.target.checked; save('kev-spell-autospeak', autoSpeak); };
  $('dexBtn').onclick = () => { renderDex(); $('dex').classList.remove('hidden'); };
  $('pickPartner').onclick = () => { renderDex(); $('dex').classList.remove('hidden'); };
  $('dexGrid').onclick = (e) => {
    const b = e.target.closest('[data-mi]');
    if (!b) return;
    partner = +b.dataset.mi; save('kev-partner', partner);
    sfx.tap(); renderDex(); renderHome();
  };
  $('evOk').onclick = nextEvent;
  $('dexClose').onclick = () => $('dex').classList.add('hidden');
  $('dex').onclick = (e) => { if (e.target.id === 'dex') $('dex').classList.add('hidden'); };
  // keyboard also works on a computer
  document.addEventListener('keydown', (e) => {
    if (!$('battle').classList.contains('on') || !G.cur) return;
    if (e.key === 'Backspace') { const last = G.cur.slots.map((s, i) => s && !s.fixed && !s.ok ? i : -1).filter(i => i >= 0).pop(); if (last !== undefined) returnSlot(last); return; }
    const ti = G.cur.tiles.findIndex(t => !t.used && t.ch === e.key.toLowerCase());
    if (ti >= 0) placeTile(ti);
  });

  renderHome();
</script>
</body>
</html>
