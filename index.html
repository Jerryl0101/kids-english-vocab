<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>英文單字練習 - 國小二年級</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<link rel="manifest" href="site.webmanifest" />
<meta name="theme-color" content="#818cf8" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="英文單字練習" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { overflow-x: hidden; max-width: 100%; }
  #emoji, #zhWord, .quiz-option { overflow-wrap: break-word; word-break: break-word; }

  /* Chrome dropped ruby-position: inter-character, so zhuyin is hand-stacked
     with flexbox instead of relying on the browser's ruby layout. */
  .zi { display: inline-flex; align-items: center; margin: 0 0.05em; }
  .hanzi { font-size: 1em; line-height: 1; }
  .zhuyin-block {
    position: relative;
    display: inline-flex;
    margin-left: 0.18em;
    font-size: 0.3em;
    color: #6366f1;
    user-select: none;
  }
  .zhuyin-letters { display: flex; flex-direction: column; line-height: 1.15; }
  /* 2nd/3rd/4th tone mark sits to the right of the stack, near the bottom */
  .tone-mark { position: absolute; right: -0.7em; bottom: 0.05em; font-size: 0.85em; line-height: 1; }
  /* neutral-tone dot sits above the first symbol */
  .tone-dot { position: absolute; left: 0.05em; top: -0.85em; font-size: 0.85em; line-height: 1; }
  @keyframes pop {
    0% { transform: scale(0.85); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .pop-in { animation: pop 0.25s ease-out; }
  @keyframes bounce-once {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .bounce-once { animation: bounce-once 0.5s ease-in-out; }

  /* Milestone celebrations (every 10 correct answers in the listening quiz) */
  #confettiLayer { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 60; }
  .confetti-piece {
    position: absolute;
    top: -10%;
    line-height: 1;
    animation-name: confetti-fall;
    animation-timing-function: ease-in;
    animation-fill-mode: forwards;
  }
  @keyframes confetti-fall {
    0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--drift, 0px), 110vh) rotate(var(--spin, 360deg)); opacity: 0.85; }
  }
  .grand-burst {
    position: fixed;
    top: 50%;
    left: 50%;
    font-size: 6rem;
    animation: grand-pop 1.6s ease-out forwards;
    z-index: 61;
  }
  @keyframes grand-pop {
    0% { transform: translate(-50%, -50%) scale(0) rotate(-15deg); opacity: 0; }
    30% { transform: translate(-50%, -50%) scale(1.3) rotate(8deg); opacity: 1; }
    55% { transform: translate(-50%, -50%) scale(1) rotate(-4deg); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.1) rotate(0deg); opacity: 0; }
  }
  #milestoneBanner {
    position: fixed;
    top: 1.5rem;
    left: 50%;
    z-index: 62;
    padding: 0.75rem 1.5rem;
    border-radius: 9999px;
    font-weight: 800;
    text-align: center;
    white-space: nowrap;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
  }
  #milestoneBanner.hidden { display: none; }
  @keyframes milestone-pop {
    0% { transform: translate(-50%, -16px) scale(0.6); opacity: 0; }
    20% { transform: translate(-50%, 0) scale(1.12); opacity: 1; }
    30% { transform: translate(-50%, 0) scale(1); }
    88% { transform: translate(-50%, 0) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -10px) scale(0.92); opacity: 0; }
  }
  #milestoneBanner.milestone-pop { animation: milestone-pop 2s ease-in-out forwards; }
  .tier-1 { background: #eef2ff; color: #4338ca; font-size: 1rem; }
  .tier-2 { background: #ecfeff; color: #0e7490; font-size: 1.05rem; }
  .tier-3 { background: linear-gradient(90deg, #fef3c7, #fde68a); color: #92400e; font-size: 1.15rem; }
  .tier-4 { background: linear-gradient(90deg, #fee2e2, #fecaca); color: #b91c1c; font-size: 1.3rem; }
  .tier-5 {
    background: linear-gradient(90deg, #fef9c3, #fde68a, #fca5a5, #c4b5fd);
    color: #78350f;
    font-size: 1.5rem;
    box-shadow: 0 0 0 4px rgba(250, 204, 21, 0.5), 0 10px 25px rgba(0, 0, 0, 0.25);
  }
</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-sky-100 via-yellow-50 to-pink-100 flex flex-col items-center justify-center p-4 font-sans">

  <header class="text-center mb-6">
    <h1 class="text-3xl sm:text-4xl font-extrabold text-indigo-600 drop-shadow-sm">🌟 英文單字練習 🌟</h1>
    <p class="text-slate-500 mt-1 text-sm sm:text-base">點一下卡片看答案，再按「下一個」繼續！</p>

    <div class="flex flex-wrap items-center justify-center gap-x-4 sm:gap-x-6 gap-y-2 mt-4 px-2">
      <label class="inline-flex items-center gap-2 cursor-pointer select-none">
        <span class="text-xs sm:text-sm font-medium text-slate-600">🎧 聽力測驗</span>
        <span class="relative inline-block w-11 h-6">
          <input type="checkbox" id="listeningToggle" class="sr-only peer" />
          <span class="absolute inset-0 rounded-full bg-slate-300 peer-checked:bg-indigo-500 transition-colors"></span>
          <span class="absolute top-1 left-1 w-4 h-4 bg-white rounded-full transition-transform peer-checked:translate-x-5"></span>
        </span>
      </label>

      <label class="inline-flex items-center gap-2 cursor-pointer select-none">
        <span class="text-xs sm:text-sm font-medium text-slate-600">🌟 只複習星星單字</span>
        <span class="relative inline-block w-11 h-6">
          <input type="checkbox" id="reviewToggle" class="sr-only peer" />
          <span class="absolute inset-0 rounded-full bg-slate-300 peer-checked:bg-amber-500 transition-colors"></span>
          <span class="absolute top-1 left-1 w-4 h-4 bg-white rounded-full transition-transform peer-checked:translate-x-5"></span>
        </span>
      </label>

      <label class="inline-flex items-center gap-2 cursor-pointer select-none">
        <span class="text-xs sm:text-sm font-medium text-slate-600">🔀 隨機出題</span>
        <span class="relative inline-block w-11 h-6">
          <input type="checkbox" id="shuffleToggle" class="sr-only peer" />
          <span class="absolute inset-0 rounded-full bg-slate-300 peer-checked:bg-emerald-500 transition-colors"></span>
          <span class="absolute top-1 left-1 w-4 h-4 bg-white rounded-full transition-transform peer-checked:translate-x-5"></span>
        </span>
      </label>
    </div>

    <div class="flex items-center justify-center gap-2 mt-3 text-xs sm:text-sm text-slate-600">
      <span>出題範圍：第</span>
      <input
        id="rangeStart"
        type="number"
        class="w-12 sm:w-14 border border-slate-300 rounded-lg px-1 py-1 text-center"
      />
      <span>～</span>
      <input
        id="rangeEnd"
        type="number"
        class="w-12 sm:w-14 border border-slate-300 rounded-lg px-1 py-1 text-center"
      />
      <span>題</span>
    </div>

    <div class="mt-3">
      <button
        id="openListBtn"
        class="inline-flex items-center gap-1.5 bg-white border-2 border-indigo-300 text-indigo-600 rounded-full px-4 py-1.5 text-sm font-bold shadow-sm hover:bg-indigo-50 active:scale-95 transition"
      >📋 單字總表</button>
    </div>
  </header>

  <div class="w-full max-w-md bg-white rounded-2xl shadow-md p-4 sm:p-5 mb-4">
    <div class="flex items-center justify-between gap-2 mb-3">
      <h2 class="text-xs sm:text-sm font-bold text-slate-700">🎯 集點卡（聽力測驗每答對 50 題蓋一個章）</h2>
      <button
        id="stampResetBtn"
        class="shrink-0 text-xs sm:text-sm font-medium text-rose-500 hover:text-rose-600 active:scale-95 transition"
      >🔄 兌換並重置</button>
    </div>
    <div id="stampSlots" class="grid grid-cols-5 sm:grid-cols-10 gap-2"></div>
    <p id="stampProgressText" class="text-xs text-slate-400 mt-2 text-center"></p>
  </div>

  <main class="w-full max-w-md">
    <div
      id="card"
      class="relative bg-white rounded-3xl shadow-xl p-5 sm:p-10 text-center cursor-pointer select-none transition-transform active:scale-95 hover:shadow-2xl overflow-hidden"
      role="button"
      tabindex="0"
      aria-label="點擊顯示英文單字"
    >
      <button
        id="starBtn"
        class="absolute top-3 right-3 text-2xl sm:text-3xl leading-none text-slate-300 active:scale-90 transition-transform"
        aria-label="標記這個單字還不熟"
      >☆</button>

      <div id="emoji" class="text-5xl sm:text-8xl mb-4"></div>

      <div id="zhWord" class="text-2xl sm:text-5xl font-bold text-slate-800 mb-4 leading-relaxed"></div>

      <div id="hint" class="font-mono text-xl sm:text-4xl tracking-widest text-indigo-400 mb-2"></div>

      <div id="quizOptions" class="hidden mt-2"></div>

      <div id="enWord" class="text-3xl sm:text-6xl font-extrabold text-emerald-500 mt-4 hidden"></div>

      <p id="tapHint" class="text-slate-400 text-xs sm:text-sm mt-4">👆 點我看答案</p>
    </div>

    <div class="flex flex-wrap items-center justify-between gap-2 mt-6">
      <span id="progress" class="min-w-0 flex-1 break-words text-slate-500 font-medium text-xs sm:text-base"></span>
      <button
        id="replayBtn"
        class="hidden shrink-0 bg-white border-2 border-indigo-300 text-indigo-500 rounded-full px-4 py-2 text-sm sm:text-base font-medium shadow hover:bg-indigo-50 active:scale-95 transition"
        aria-label="再聽一次發音"
      >🔊 重聽</button>
    </div>

    <div class="flex gap-3 mt-4">
      <button
        id="prevBtn"
        class="flex-1 bg-white border-2 border-indigo-300 text-indigo-500 text-xl font-bold py-4 rounded-full shadow hover:bg-indigo-50 active:scale-95 transition"
      >⬅ 上一個</button>
      <button
        id="nextBtn"
        class="flex-1 bg-indigo-500 hover:bg-indigo-600 active:scale-95 text-white text-xl font-bold py-4 rounded-full shadow-lg transition-transform"
      >下一個 ➜</button>
    </div>
  </main>

  <div id="confettiLayer"></div>
  <div id="milestoneBanner" class="hidden"></div>

  <!-- 單字總表：一鍵瀏覽全部中英文，關閉後回到原本的測驗狀態 -->
  <div id="listOverlay" class="hidden fixed inset-0 z-50 bg-white flex flex-col">
    <div class="shrink-0 border-b border-slate-200 bg-white/95 backdrop-blur px-4 py-3">
      <div class="max-w-2xl mx-auto flex flex-wrap items-center gap-x-3 gap-y-2">
        <h2 class="text-lg font-extrabold text-indigo-600 whitespace-nowrap">📋 單字總表</h2>
        <span id="listCount" class="text-xs text-slate-400 whitespace-nowrap"></span>
        <input
          id="listFilter"
          type="search"
          placeholder="搜尋中文、英文或題號…"
          class="order-last w-full sm:order-none sm:w-auto sm:flex-1 min-w-0 border border-slate-300 rounded-lg px-3 py-1.5 text-sm"
        />
        <button
          id="closeListBtn"
          class="shrink-0 bg-indigo-500 hover:bg-indigo-600 text-white rounded-full px-4 py-1.5 text-sm font-bold active:scale-95 transition"
        >✕ 返回測驗</button>
      </div>
    </div>
    <div class="flex-1 overflow-y-auto px-4 py-3">
      <ol id="listBody" class="max-w-2xl mx-auto divide-y divide-slate-100"></ol>
      <p id="listEmpty" class="hidden max-w-2xl mx-auto text-center text-slate-400 py-10 text-sm">找不到符合的單字</p>
    </div>
  </div>

  let stampProgress = parseInt(localStorage.getItem('kev-stamp-progress') || '0', 10);
  if (Number.isNaN(stampCount)) stampCount = 0;
  if (Number.isNaN(stampProgress)) stampProgress = 0;

  const MILESTONES = [
    { count: 10, confetti: 14, notes: [523.25, 659.25], message: '🎉 答對 10 題了！', tier: 'tier-1' },
    { count: 20, confetti: 22, notes: [523.25, 659.25, 783.99], message: '🌟 答對 20 題，繼續加油！', tier: 'tier-2' },
    { count: 30, confetti: 32, notes: [523.25, 659.25, 783.99, 1046.5], message: '🔥 答對 30 題，超厲害！', tier: 'tier-3' },
    { count: 40, confetti: 46, notes: [523.25, 659.25, 783.99, 1046.5, 1318.5], message: '🚀 答對 40 題，快滿分了！', tier: 'tier-4' },
    {
      count: 50,
      confetti: 70,
      notes: [523.25, 659.25, 783.99, 1046.5, 1318.5, 1568],
      message: '👑 太厲害了！答對 50 題！',
      tier: 'tier-5',
      grand: true,
    },
  ];

  rangeStartInput.min = 1;
  rangeStartInput.max = WORDS.length;
  rangeStartInput.value = 1;
  rangeEndInput.min = 1;
  rangeEndInput.max = WORDS.length;
  rangeEndInput.value = WORDS.length;

  function saveStarred() {
    localStorage.setItem('kev-starred', JSON.stringify([...starred]));
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function ensureAudioCtx() {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  function playTone(ctx, freq, start, dur, peakGain) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(peakGain, start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(start);
    osc.stop(start + dur + 0.02);
  }

  function playCelebration() {
    try {
      const ctx = ensureAudioCtx();
      const now = ctx.currentTime;
      [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
        playTone(ctx, freq, now + i * 0.1, 0.3, 0.25);
      });
    } catch (e) {
      // Web Audio unsupported — silently skip the celebration sound.
    }
  }

  function playChime(notes, grand) {
    try {
      const ctx = ensureAudioCtx();
      const now = ctx.currentTime;
      const step = 0.11;
      notes.forEach((freq, i) => {
        playTone(ctx, freq, now + i * step, 0.32, 0.28);
      });
      if (grand) {
        const chordStart = now + notes.length * step + 0.05;
        notes.slice(-3).forEach((freq) => playTone(ctx, freq * 2, chordStart, 0.7, 0.2));
      }
    } catch (e) {
      // Web Audio unsupported — silently skip the milestone chime.
    }
  }

  const CONFETTI_EMOJI = ['🎉', '✨', '⭐', '🌈', '💫', '🎊', '🥳'];

  function spawnConfetti(count, grand) {
    const layer = document.getElementById('confettiLayer');
    for (let i = 0; i < count; i++) {
      const piece = document.createElement('span');
      piece.className = 'confetti-piece';
      piece.textContent = CONFETTI_EMOJI[Math.floor(Math.random() * CONFETTI_EMOJI.length)];
      const duration = 1.6 + Math.random() * (grand ? 1.6 : 1.0);
      const delay = Math.random() * (grand ? 0.6 : 0.3);
      const size = grand ? 1.4 + Math.random() * 1.2 : 1.1 + Math.random() * 0.6;
      piece.style.left = `${Math.random() * 100}%`;
      piece.style.fontSize = `${size}rem`;
      piece.style.setProperty('--drift', `${(Math.random() - 0.5) * 200}px`);
      piece.style.setProperty('--spin', `${360 + Math.random() * 360}deg`);
      piece.style.animationDuration = `${duration}s`;
      piece.style.animationDelay = `${delay}s`;
      layer.appendChild(piece);
      setTimeout(() => piece.remove(), (duration + delay) * 1000 + 100);
    }
  }

  function spawnGrandBurst() {
    const layer = document.getElementById('confettiLayer');
    const burst = document.createElement('div');
    burst.className = 'grand-burst';
    burst.textContent = '🏆';
    layer.appendChild(burst);
    setTimeout(() => burst.remove(), 1700);
  }

  let bannerTimeout = null;

  function showMilestoneBanner(milestone) {
    const banner = document.getElementById('milestoneBanner');
    clearTimeout(bannerTimeout);
    banner.classList.add('hidden');
    banner.classList.remove('milestone-pop', 'tier-1', 'tier-2', 'tier-3', 'tier-4', 'tier-5');
    void banner.offsetWidth;
    banner.textContent = milestone.message;
    banner.classList.remove('hidden');
    banner.classList.add('milestone-pop', milestone.tier);
    bannerTimeout = setTimeout(() => {
      banner.classList.add('hidden');
    }, 2000 + (milestone.grand ? 600 : 0));
  }

  function getMilestone(count) {
    if (count === 0 || count % 10 !== 0) return null;
    const tierIndex = Math.min(Math.floor(count / 10), MILESTONES.length) - 1;
    return MILESTONES[tierIndex];
  }

  function celebrateMilestone(milestone) {
    showMilestoneBanner(milestone);
    spawnConfetti(milestone.confetti, milestone.grand);
    if (milestone.grand) spawnGrandBurst();
    setTimeout(() => playChime(milestone.notes, !!milestone.grand), 300);
  }

  function saveStamps() {
    localStorage.setItem('kev-stamp-count', String(stampCount));
    localStorage.setItem('kev-stamp-progress', String(stampProgress));
  }

  function playStampSound() {
    try {
      const ctx = ensureAudioCtx();
      const now = ctx.currentTime;
      playTone(ctx, 200, now, 0.14, 0.3);
      playTone(ctx, 140, now + 0.09, 0.2, 0.25);
    } catch (e) {
      // Web Audio unsupported — silently skip the stamp sound.
    }
  }

  function renderStampCard(justEarned) {
    stampSlotsEl.innerHTML = '';
    for (let i = 0; i < STAMP_GOAL; i++) {
      const slot = document.createElement('div');
      const filled = i < stampCount;
      slot.className = filled
        ? 'aspect-square rounded-xl border-2 border-amber-300 bg-amber-50 flex items-center justify-center text-xl sm:text-2xl'
        : 'aspect-square rounded-xl border-2 border-dashed border-slate-300 flex items-center justify-center text-slate-300 text-xs sm:text-base';
      if (filled) {
        slot.textContent = '🏅';
        if (justEarned && i === stampCount - 1) {
          slot.classList.add('pop-in');
        }
      } else {
        slot.textContent = String(i + 1);
      }
      stampSlotsEl.appendChild(slot);
    }

    stampProgressTextEl.textContent =
      stampCount >= STAMP_GOAL
        ? '🎉 集滿 10 個章了！快去兌換獎勵，兌換後記得按重置！'
        : `再答對 ${STAMP_THRESHOLD - stampProgress} 題聽力測驗，就能蓋下一個章（${stampCount} / ${STAMP_GOAL}）`;

    stampResetBtn.classList.toggle('opacity-40', stampCount === 0 && stampProgress === 0);
  }

  function addStampProgress() {
    if (stampCount >= STAMP_GOAL) return;
    stampProgress += 1;
    let earned = false;
    if (stampProgress >= STAMP_THRESHOLD) {
      stampProgress = 0;
      stampCount = Math.min(stampCount + 1, STAMP_GOAL);
      earned = true;
    }
    saveStamps();
    renderStampCard(earned);
    if (earned) playStampSound();
  }

  stampResetBtn.addEventListener('click', () => {
    if (stampCount === 0 && stampProgress === 0) return;
    const message =
      stampCount >= STAMP_GOAL
        ? '確定已經兌換完成獎勵了嗎？按下去會清空集點卡，重新開始收集！'
        : `目前只有 ${stampCount} / ${STAMP_GOAL} 個章，還沒集滿，確定要清空重新開始嗎？`;
    if (window.confirm(message)) {
      stampCount = 0;
      stampProgress = 0;
      saveStamps();
      renderStampCard(false);
    }
  });

  function pickDistractors(correctIndex, count) {
    const correctZh = WORDS[correctIndex].zh;
    const pool = allIndices.filter((i) => i !== correctIndex && WORDS[i].zh !== correctZh);
    return shuffle(pool).slice(0, count);
  }

  function renderQuizOptions(correctIndex) {
    quizOptionsEl.innerHTML = '';
    const optionIndices = shuffle([correctIndex, ...pickDistractors(correctIndex, 2)]);

    optionIndices.forEach((idx) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className =
        'quiz-option block w-full text-lg sm:text-3xl font-bold py-3 sm:py-4 px-3 sm:px-4 mb-3 rounded-2xl border-2 border-slate-200 bg-white hover:bg-slate-50 active:scale-95 transition';
      btn.innerHTML = renderZhuyin(WORDS[idx].ruby);
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        handleOptionClick(btn, idx, correctIndex);
      });
      quizOptionsEl.appendChild(btn);
    });
  }

  function handleOptionClick(btn, chosenIndex, correctIndex) {
    if (quizAnswered || btn.disabled) return;

    if (chosenIndex === correctIndex) {
      quizAnswered = true;
      btn.disabled = true;
      btn.classList.remove('border-slate-200', 'hover:bg-slate-50');
      btn.classList.add('border-emerald-400', 'bg-emerald-50', 'text-emerald-600');
      Array.from(quizOptionsEl.children).forEach((b) => {
        if (b !== btn) b.remove();
      });
      playCelebration();
      revealAnswer('🎉 答對了！');

      correctCount += 1;
      const milestone = getMilestone(correctCount);
      if (milestone) celebrateMilestone(milestone);
      addStampProgress();
    } else {
      btn.disabled = true;
      btn.classList.remove('border-slate-200', 'hover:bg-slate-50');
      btn.classList.add('border-rose-300', 'bg-rose-50', 'text-rose-400', 'opacity-70');

      if (!starred.has(correctIndex)) {
        starred.add(correctIndex);
        saveStarred();
        updateStarButton(correctIndex);
      }
    }
  }

  function clampRange(value, min, max) {
    if (Number.isNaN(value)) return min;
    return Math.min(Math.max(value, min), max);
  }

  function computeRangeIndices() {
    const start = clampRange(parseInt(rangeStartInput.value, 10), 1, WORDS.length);
    const end = clampRange(parseInt(rangeEndInput.value, 10), 1, WORDS.length);
    const lo = Math.min(start, end);
    const hi = Math.max(start, end);
    rangeStartInput.value = lo;
    rangeEndInput.value = hi;

    const rangeIndices = [];
    for (let i = lo - 1; i <= hi - 1; i++) rangeIndices.push(i);
    return rangeIndices;
  }

  function isFullRange() {
    return Number(rangeStartInput.value) === 1 && Number(rangeEndInput.value) === WORDS.length;
  }

  function rebuildActiveIndices() {
    const currentWordIndex = activeIndices[playPos];
    const base = reviewMode ? allIndices.filter((i) => starred.has(i)) : computeRangeIndices();
    activeIndices = shuffleMode ? shuffle(base) : base;
    const preservedPos = activeIndices.indexOf(currentWordIndex);
    playPos = preservedPos !== -1 ? preservedPos : 0;
  }

  function loadVoices() {
    cachedVoices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  }
  if ('speechSynthesis' in window) {
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }

  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'en-US';
    utter.rate = 0.9;
    const enUsVoice = cachedVoices.find(v => v.lang === 'en-US') || cachedVoices.find(v => v.lang && v.lang.startsWith('en'));
    if (enUsVoice) utter.voice = enUsVoice;
    window.speechSynthesis.speak(utter);
  }

  const RUBY_RE = /<ruby>(.*?)<rt>(.*?)<\/rt><\/ruby>/g;
  const TONE_MARKS = ['ˊ', 'ˇ', 'ˋ'];

  function renderZhuyin(rubyHtml) {
    let html = '';
    let match;
    RUBY_RE.lastIndex = 0;
    while ((match = RUBY_RE.exec(rubyHtml)) !== null) {
      const hanzi = match[1];
      let zhuyin = match[2];

      let dot = '';
      let tone = '';
      if (zhuyin.startsWith('˙')) {
        dot = zhuyin[0];
        zhuyin = zhuyin.slice(1);
      } else if (TONE_MARKS.includes(zhuyin.slice(-1))) {
        tone = zhuyin.slice(-1);
        zhuyin = zhuyin.slice(0, -1);
      }

      const letters = Array.from(zhuyin)
        .map((s) => `<span>${s}</span>`)
        .join('');
      const dotHtml = dot ? `<span class="tone-dot">${dot}</span>` : '';
      const toneHtml = tone ? `<span class="tone-mark">${tone}</span>` : '';

      html += `<span class="zi"><span class="hanzi">${hanzi}</span><span class="zhuyin-block">${dotHtml}${toneHtml}<span class="zhuyin-letters">${letters}</span></span></span>`;
    }
    return html;
  }

  function letterHint(word) {
    return word
      .split('')
      .map((ch, i) => {
        if (i === 0) return ch.toLowerCase();
        if (/[a-zA-Z]/.test(ch)) return '_';
        return ch;
      })
      .join(' ');
  }

  function updateStarButton(wordIndex) {
    const isStarred = starred.has(wordIndex);
    starBtn.textContent = isStarred ? '⭐' : '☆';
    starBtn.classList.toggle('text-amber-400', isStarred);
    starBtn.classList.toggle('text-slate-300', !isStarred);
  }

  function loadWord() {
    revealed = false;

    if (activeIndices.length === 0) {
      emojiEl.textContent = '';
      zhWordEl.innerHTML = '';
      hintEl.textContent = '';
      enWordEl.textContent = '';
      enWordEl.classList.add('hidden');
      replayBtn.classList.add('hidden');
      starBtn.classList.add('hidden');
      quizOptionsEl.classList.add('hidden');
      progressEl.textContent = '0 / 0';
      tapHintEl.classList.remove('hidden');
      tapHintEl.textContent = '🌟 還沒有標記任何單字，切換回一般模式練習，把不熟的單字點星星標記起來吧！';
      cardEl.classList.remove('pop-in');
      void cardEl.offsetWidth;
      cardEl.classList.add('pop-in');
      return;
    }

    starBtn.classList.remove('hidden');
    const wordIndex = activeIndices[playPos];
    const word = WORDS[wordIndex];

    emojiEl.textContent = word.emoji;
    zhWordEl.innerHTML = renderZhuyin(word.ruby);
    hintEl.textContent = letterHint(word.en);
    enWordEl.textContent = word.en;
    enWordEl.classList.add('hidden');
    replayBtn.classList.toggle('hidden', !listeningMode);
    updateStarButton(wordIndex);
    if (reviewMode) {
      progressEl.textContent = `⭐ 複習模式：第 ${playPos + 1} / ${activeIndices.length} 個`;
    } else {
      const rangeLabel = isFullRange() ? '' : `第 ${rangeStartInput.value}～${rangeEndInput.value} 題範圍・`;
      const shuffleLabel = shuffleMode ? '🔀 隨機出題' : '📖 依序出題';
      const prefix = rangeLabel || shuffleMode ? `${rangeLabel}${shuffleLabel}：` : '';
      progressEl.textContent = `${prefix}第 ${playPos + 1} / ${activeIndices.length} 個`;
    }

    emojiEl.classList.toggle('hidden', listeningMode);
    zhWordEl.classList.toggle('hidden', listeningMode);
    hintEl.classList.toggle('hidden', listeningMode);
    quizOptionsEl.classList.toggle('hidden', !listeningMode);
    quizAnswered = false;
    tapHintEl.classList.remove('hidden');

    if (listeningMode) {
      renderQuizOptions(wordIndex);
      tapHintEl.textContent = '🎧 仔細聽，選出正確的意思！';
    } else {
      tapHintEl.textContent = '👆 點我看答案';
    }

    cardEl.classList.remove('pop-in');
    void cardEl.offsetWidth;
    cardEl.classList.add('pop-in');

    if (listeningMode) {
      speak(word.en);
    }
  }

  function revealAnswer(message) {
    if (revealed) return;
    revealed = true;
    emojiEl.classList.remove('hidden');
    zhWordEl.classList.remove('hidden');
    hintEl.classList.remove('hidden');
    enWordEl.classList.remove('hidden');
    enWordEl.classList.add('bounce-once');
    tapHintEl.textContent = message;
    replayBtn.classList.remove('hidden');
  }

  function reveal() {
    if (listeningMode || activeIndices.length === 0) return;
    const word = WORDS[activeIndices[playPos]];
    revealAnswer('🔁 再點一次可以再聽一遍');
    speak(word.en);
  }

  cardEl.addEventListener('click', reveal);
  cardEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      reveal();
    }
  });

  replayBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (activeIndices.length === 0) return;
    speak(WORDS[activeIndices[playPos]].en);
  });

  starBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (activeIndices.length === 0) return;
    const wordIndex = activeIndices[playPos];
    if (starred.has(wordIndex)) {
      starred.delete(wordIndex);
    } else {
      starred.add(wordIndex);
    }
    saveStarred();
    if (reviewMode) {
      rebuildActiveIndices();
      loadWord();
    } else {
      updateStarButton(wordIndex);
    }
  });

  prevBtn.addEventListener('click', () => {
    if (activeIndices.length === 0) return;
    playPos = (playPos - 1 + activeIndices.length) % activeIndices.length;
    loadWord();
  });

  nextBtn.addEventListener('click', () => {
    if (activeIndices.length === 0) return;
    playPos = (playPos + 1) % activeIndices.length;
    loadWord();
  });

  listeningToggle.addEventListener('change', () => {
    listeningMode = listeningToggle.checked;
    loadWord();
  });

  reviewToggle.addEventListener('change', () => {
    if (reviewToggle.checked && starred.size === 0) {
      reviewToggle.checked = false;
      alert('目前還沒有標記任何單字喔！練習時點卡片右上角的星星，把答錯或不熟的單字標記起來吧。');
      return;
    }
    reviewMode = reviewToggle.checked;
    rebuildActiveIndices();
    loadWord();
  });

  shuffleToggle.addEventListener('change', () => {
    shuffleMode = shuffleToggle.checked;
    rebuildActiveIndices();
    loadWord();
  });

  rangeStartInput.addEventListener('change', () => {
    rebuildActiveIndices();
    loadWord();
  });
  rangeEndInput.addEventListener('change', () => {
    rebuildActiveIndices();
    loadWord();
  });

  // ---- 單字總表 ----
  const openListBtn = document.getElementById('openListBtn');
  const closeListBtn = document.getElementById('closeListBtn');
  const listOverlay = document.getElementById('listOverlay');
  const listBody = document.getElementById('listBody');
  const listFilter = document.getElementById('listFilter');
  const listCount = document.getElementById('listCount');
  const listEmpty = document.getElementById('listEmpty');

  function renderWordList(filter) {
    const q = (filter || '').trim().toLowerCase();
    listBody.innerHTML = '';
    let shown = 0;
    WORDS.forEach((w, i) => {
      if (
        q &&
        !w.en.toLowerCase().includes(q) &&
        !w.zh.toLowerCase().includes(q) &&
        String(i + 1) !== q
      ) return;
      shown += 1;
      const li = document.createElement('li');
      li.className = 'flex items-baseline gap-3 py-2';
      li.innerHTML =
        `<span class="w-8 shrink-0 text-right text-xs font-mono text-slate-400">${i + 1}</span>` +
        `<span class="w-32 sm:w-40 shrink-0 font-bold text-slate-800 break-words">${w.en}</span>` +
        `<span class="flex-1 min-w-0 text-slate-600 break-words">${w.zh}` +
        (starred.has(i) ? ' <span class="text-amber-400">⭐</span>' : '') +
        `</span>`;
      listBody.appendChild(li);
    });
    listEmpty.classList.toggle('hidden', shown > 0);
    listCount.textContent = q ? `${shown} / ${WORDS.length}` : `共 ${WORDS.length} 個`;
  }

  function openList() {
    renderWordList(listFilter.value);
    listOverlay.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  }

  function closeList() {
    listOverlay.classList.add('hidden');
    document.body.style.overflow = '';
  }

  openListBtn.addEventListener('click', openList);
  closeListBtn.addEventListener('click', closeList);
  listFilter.addEventListener('input', () => renderWordList(listFilter.value));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !listOverlay.classList.contains('hidden')) closeList();
  });

  renderStampCard(false);
  loadWord();
</script>
</body>
</html>
