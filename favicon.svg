<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="英文單字練習">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)"/>

  <!-- open book with Aa written across the pages -->
  <g transform="rotate(-6 32 35)">
    <path d="M32 23 C 25 18, 15 18, 9 21 L9 46 C 15 43, 25 43, 32 47.5 Z" fill="#ffffff"/>
    <path d="M32 23 C 39 18, 49 18, 55 21 L55 46 C 49 43, 39 43, 32 47.5 Z" fill="#e0e7ff"/>
    <path d="M32 23 L32 47.5" stroke="#c7d2fe" stroke-width="2" stroke-linecap="round"/>
    <text x="20" y="35" text-anchor="middle" dominant-baseline="central"
          font-family="'Segoe UI','Trebuchet MS',Verdana,sans-serif"
          font-size="17" font-weight="800" fill="#4f46e5">A</text>
    <text x="43.5" y="36" text-anchor="middle" dominant-baseline="central"
          font-family="'Segoe UI','Trebuchet MS',Verdana,sans-serif"
          font-size="15" font-weight="800" fill="#7c3aed">a</text>
  </g>

  <!-- star -->
  <path d="M32 3 L34.3 8.7 L40.4 9.1 L35.7 13 L37.2 18.9 L32 15.6 L26.8 18.9 L28.3 13 L23.6 9.1 L29.7 8.7 Z"
        fill="#fbbf24" stroke="#f59e0b" stroke-width="1.1" stroke-linejoin="round"/>
</svg>
